version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: taskscheduler3-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskscheduler
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskscheduler3-network

  # REST API Unsecure
  rest-api-unsecure:
    build:
      context: ./rest-api-unsecure
      dockerfile: Dockerfile
    container_name: rest-api-unsecure
    ports:
      - "8081:8081"
    networks:
      - taskscheduler3-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # REST API Secure
  rest-api-secure:
    build:
      context: ./rest-api-secure
      dockerfile: Dockerfile
    container_name: rest-api-secure
    ports:
      - "8082:8082"
    networks:
      - taskscheduler3-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  taskscheduler3-network:
    driver: bridge

volumes:
  mysql-data: