<div class="task-list-container">
  <div class="page-header">
    <h1>Tasks</h1>
    <button mat-raised-button color="primary" (click)="createTask()">
      <mat-icon>add</mat-icon>
      Create Task
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div *ngIf="loading" class="loading-spinner">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="error" class="error-message">
        <p>Failed to load tasks. Please try again later.</p>
        <button mat-raised-button color="primary" (click)="loadTasks()">Retry</button>
      </div>

      <div *ngIf="!loading && !error">
        <mat-form-field class="filter-field">
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Filter tasks">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div class="table-container">
          <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
              <td mat-cell *matCellDef="let task"> {{ task.name }} </td>
            </ng-container>

            <!-- Task Type Column -->
            <ng-container matColumnDef="taskType">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Type </th>
              <td mat-cell *matCellDef="let task"> {{ task.taskType }} </td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
              <td mat-cell *matCellDef="let task">
                <span [ngClass]="getStatusClass(task.status)">
                  {{ task.status }}
                </span>
              </td>
            </ng-container>

            <!-- Cron Expression Column -->
            <ng-container matColumnDef="cronExpression">
              <th mat-header-cell *matHeaderCellDef> Cron Expression </th>
              <td mat-cell *matCellDef="let task"> {{ task.cronExpression }} </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef> Actions </th>
              <td mat-cell *matCellDef="let task">
                <div class="action-buttons">
                  <button mat-icon-button color="primary" matTooltip="View Details" (click)="viewTask(task.id!)">
                    <mat-icon>visibility</mat-icon>
                  </button>
                  <button mat-icon-button color="accent" matTooltip="Edit Task" (click)="editTask(task.id!)">
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button mat-icon-button matTooltip="View Executions" (click)="viewExecutions(task.id!)">
                    <mat-icon>history</mat-icon>
                  </button>
                  <button *ngIf="task.status === 'INACTIVE'" mat-icon-button color="primary" matTooltip="Activate Task" (click)="activateTask(task)">
                    <mat-icon>play_arrow</mat-icon>
                  </button>
                  <button *ngIf="task.status === 'ACTIVE'" mat-icon-button color="warn" matTooltip="Deactivate Task" (click)="deactivateTask(task)">
                    <mat-icon>pause</mat-icon>
                  </button>
                  <button mat-icon-button color="warn" matTooltip="Delete Task" (click)="deleteTask(task)">
                    <mat-icon>delete</mat-icon>
                  </button>
                </div>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="5">No tasks found</td>
            </tr>
          </table>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
