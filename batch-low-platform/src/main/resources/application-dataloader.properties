# Configuration for data loader profile
spring.main.web-application-type=none
spring.batch.job.enabled=false

# Database configuration
spring.datasource.url=jdbc:h2:file:./batch-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable batch initialization
spring.batch.jdbc.initialize-schema=never

# Logging
logging.level.com.example.batch.low=INFO
logging.file.name=logs/data-loader.log