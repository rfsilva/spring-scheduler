spring:
  application:
    name: task-scheduler

  # ==============================================
  # DATABASE CONFIGURATION
  # ==============================================
  datasource:
    url: jdbc:mysql://localhost:3306/taskscheduler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  # ==============================================
  # JPA CONFIGURATION
  # ==============================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ==============================================
  # FLYWAY CONFIGURATION
  # ==============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ==============================================
  # QUARTZ CONFIGURATION (IN-MEMORY STORE)
  # ==============================================
  quartz:
    job-store-type: memory   # Usa armazenamento em memória (RAMJobStore)
    properties:
      org.quartz.scheduler.instanceName: TaskSchedulerInMemoryInstance
      org.quartz.scheduler.instanceId: AUTO

      # Usa o JobStore em memória (sem JDBC)
      org.quartz.jobStore.class: org.quartz.simpl.RAMJobStore

      # Thread pool padrão
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 10
      org.quartz.threadPool.threadPriority: 5

      # Outras configurações
      org.quartz.scheduler.wrapJobExecutionInUserTransaction: false

  # ==============================================
  # CORS CONFIGURATION
  # ==============================================
  web:
    cors:
      allowed-origins: "http://localhost:4200"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

# ==============================================
# SERVER CONFIGURATION
# ==============================================
server:
  port: 8080
  servlet:
    context-path: /api
  shutdown: graceful

# ==============================================
# SPRINGDOC/SWAGGER CONFIGURATION
# ==============================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
  show-actuator: true
  packages-to-scan: com.taskscheduler.controller
  paths-to-match: /**

# ==============================================
# LOGGING CONFIGURATION
# ==============================================
logging:
  level:
    root: INFO
    com.taskscheduler: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: INFO
    org.quartz: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/task-scheduler.log
    max-size: 10MB
    max-history: 30